<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZIVA | Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: #fff8f3;
        }

        .auth-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 45px;
            border: 1px solid #eadbd3;
            box-shadow: 0 10px 30px rgba(36,27,25,.08);
        }

        .auth-box h1 {
            text-align: center;
            color: #241b19;
            margin: 0 0 10px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #777;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-tab.active {
            color: #8b4f55;
            border-bottom: 2px solid #8b4f55;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
            font-weight: bold;
            color: #241b19;
        }

        .auth-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #d8c6bd;
            outline: none;
            font-size: 14px;
        }

        .auth-form input:focus {
            border-color: #8b4f55;
        }

        .auth-submit {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            background: #241b19;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .auth-submit:hover {
            background: #8b4f55;
        }

        .auth-note {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

        .password-note {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
        }

        @media (max-width: 500px) {
            .auth-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">ZIVA</div>

    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="index.html#new-in">New In</a>
        <a href="index.html#women-section">Women</a>
        <a href="index.html#men-section">Men</a>
        <a href="index.html#sale-section">Sale</a>
    </nav>

    <div class="header-actions">

        <button
            class="icon-btn"
            onclick="openSearch()">
            ⌕
        </button>

        <button
            class="icon-btn"
            onclick="window.location.href='login.html'">
            ♡
        </button>

        <button
            class="cart-btn"
            id="cartButton">
            🛍 Cart (0)
        </button>

    </div>

</header>


<main class="auth-page">

    <div class="auth-box">

        <h1>Welcome to ZIVA</h1>

        <p class="auth-subtitle">
            Login or create your ZIVA account
        </p>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                type="button"
                class="auth-tab active"
                onclick="showLogin()">
                LOGIN
            </button>

            <button
                type="button"
                class="auth-tab"
                onclick="showSignup()">
                SIGN UP
            </button>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            class="auth-form active"
            onsubmit="loginUser(event)">

            <label for="loginIdentifier">
                Email or Mobile Number
            </label>

            <input
                type="text"
                id="loginIdentifier"
                placeholder="Enter email or mobile number"
                autocomplete="username"
                required>


            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>


            <button
                type="submit"
                class="auth-submit">
                LOGIN
            </button>

        </form>


        <!-- SIGN UP FORM -->

        <form
            id="signupForm"
            class="auth-form"
            onsubmit="signupUser(event)">

            <label for="signupName">
                Full Name
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                autocomplete="name"
                required>


            <label for="signupIdentifier">
                Email or Mobile Number
            </label>

            <input
                type="text"
                id="signupIdentifier"
                placeholder="Enter email or mobile number"
                autocomplete="username"
                required>


            <label for="signupPassword">
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required>

            <p class="password-note">
                Password must be at least 6 characters.
            </p>


            <button
                type="submit"
                class="auth-submit">
                CREATE ACCOUNT
            </button>

        </form>


        <p class="auth-note">
            By continuing, you agree to ZIVA's Terms & Privacy Policy.
        </p>

    </div>

</main>


<footer>

    <div class="footer-logo">ZIVA</div>

    <p>Modern fashion for everyone.</p>

    <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
    </div>

    <small>
        © 2026 ZIVA. All Rights Reserved.
    </small>

</footer>


<script src="script.js"></script>


<script>

/* =========================
   AUTH TABS
========================= */

function showLogin() {

    document.getElementById("loginForm")
        .classList.add("active");

    document.getElementById("signupForm")
        .classList.remove("active");

    document.querySelectorAll(".auth-tab")[0]
        .classList.add("active");

    document.querySelectorAll(".auth-tab")[1]
        .classList.remove("active");
}


function showSignup() {

    document.getElementById("signupForm")
        .classList.add("active");

    document.getElementById("loginForm")
        .classList.remove("active");

    document.querySelectorAll(".auth-tab")[1]
        .classList.add("active");

    document.querySelectorAll(".auth-tab")[0]
        .classList.remove("active");
}


/* =========================
   SIGN UP
========================= */

function signupUser(event) {

    event.preventDefault();

    const name =
        document.getElementById("signupName")
        .value
        .trim();

    const identifier =
        document.getElementById("signupIdentifier")
        .value
        .trim();

    const password =
        document.getElementById("signupPassword")
        .value;


    if (password.length < 6) {

        alert("Password must be at least 6 characters.");

        return;
    }


    if (identifier === "") {

        alert("Please enter your email or mobile number.");

        return;
    }


    const existingUser =
        JSON.parse(localStorage.getItem("zivaUser"));


    if (existingUser) {

        if (
            existingUser.identifier.toLowerCase() ===
            identifier.toLowerCase()
        ) {

            alert(
                "An account with this email or mobile number already exists."
            );

            showLogin();

            document.getElementById("loginIdentifier")
                .value = identifier;

            return;
        }
    }


    const user = {

        name: name,

        identifier: identifier,

        password: password,

        createdAt: new Date().toISOString()

    };


    localStorage.setItem(
        "zivaUser",
        JSON.stringify(user)
    );


    alert(
        "ZIVA account created successfully! Please login."
    );


    document.getElementById("signupForm").reset();

    showLogin();


    document.getElementById("loginIdentifier")
        .value = identifier;

}


/* =========================
   LOGIN
========================= */

function loginUser(event) {

    event.preventDefault();


    const identifier =
        document.getElementById("loginIdentifier")
        .value
        .trim();

    const password =
        document.getElementById("loginPassword")
        .value;


    const user =
        JSON.parse(localStorage.getItem("zivaUser"));


    if (!user) {

        alert(
            "Account not found. Please create an account first."
        );

        showSignup();

        return;
    }


    const identifierMatch =
        user.identifier.toLowerCase() ===
        identifier.toLowerCase();


    const passwordMatch =
        user.password === password;


    if (
        identifierMatch &&
        passwordMatch
    ) {

        localStorage.setItem(
            "zivaLoggedIn",
            "true"
        );


        localStorage.setItem(
            "zivaCurrentUser",
            JSON.stringify({
                name: user.name,
                identifier: user.identifier
            })
        );


        alert(
            "Welcome back to ZIVA, " +
            user.name +
            "!"
        );


        window.location.href = "index.html";

    } else {

        alert(
            "Email/mobile number or password is incorrect."
        );

    }

}


/* =========================
   LOGOUT
========================= */

function logoutUser() {

    localStorage.removeItem("zivaLoggedIn");

    localStorage.removeItem("zivaCurrentUser");

    alert("You have been logged out.");

    window.location.href = "login.html";
}

</script>

</body>
</html>
