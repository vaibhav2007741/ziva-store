<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Orders | ZIVA</title>

  <style>
    :root{
      --cream:#f8f3ed;
      --white:#ffffff;
      --black:#151515;
      --muted:#777;
      --border:#e8dfd6;
      --blush:#ead8d2;
      --brown:#73594c;
      --gold:#b18a4a;
      --green:#3d7656;
      --shadow:0 15px 45px rgba(35,25,20,.08);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:var(--cream);
      color:var(--black);
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font-family:inherit;
    }

    /* HEADER */
    .header{
      height:76px;
      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 5%;
      position:sticky;
      top:0;
      z-index:100;
      backdrop-filter:blur(12px);
    }

    .logo{
      font-size:29px;
      font-weight:800;
      letter-spacing:5px;
    }

    .nav{
      display:flex;
      gap:28px;
      align-items:center;
    }

    .nav a{
      font-size:14px;
      font-weight:600;
      transition:.25s;
    }

    .nav a:hover{
      color:var(--brown);
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .header-btn{
      border:1px solid var(--border);
      background:white;
      border-radius:30px;
      padding:10px 15px;
      cursor:pointer;
      font-size:13px;
      font-weight:600;
    }

    .header-btn:hover{
      background:var(--black);
      color:white;
    }

    /* PAGE */
    .page{
      width:min(1180px,92%);
      margin:0 auto;
      padding:55px 0 80px;
    }

    .page-head{
      margin-bottom:35px;
    }

    .eyebrow{
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:3px;
      font-size:11px;
      font-weight:700;
      margin-bottom:10px;
    }

    .page-head h1{
      font-family:Georgia,serif;
      font-size:42px;
      margin-bottom:10px;
    }

    .page-head p{
      color:var(--muted);
      font-size:15px;
    }

    /* USER CARD */
    .account-card{
      background:var(--black);
      color:white;
      border-radius:22px;
      padding:25px 28px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:30px;
      box-shadow:var(--shadow);
    }

    .account-info{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .avatar{
      width:54px;
      height:54px;
      border-radius:50%;
      background:var(--blush);
      color:var(--black);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:19px;
    }

    .account-info h3{
      font-size:17px;
      margin-bottom:5px;
    }

    .account-info p{
      color:#c9c9c9;
      font-size:13px;
    }

    .logout-btn{
      border:1px solid #555;
      background:transparent;
      color:white;
      border-radius:25px;
      padding:10px 17px;
      cursor:pointer;
      font-weight:600;
    }

    .logout-btn:hover{
      background:white;
      color:var(--black);
    }

    /* ORDER */
    .orders-list{
      display:flex;
      flex-direction:column;
      gap:22px;
    }

    .order-card{
      background:white;
      border:1px solid var(--border);
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 8px 30px rgba(30,20,15,.04);
    }

    .order-top{
      padding:20px 24px;
      background:#fcfaf8;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }

    .order-id{
      font-size:14px;
      font-weight:800;
      margin-bottom:6px;
    }

    .order-date{
      font-size:12px;
      color:var(--muted);
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:7px;
      background:#edf6ef;
      color:var(--green);
      border-radius:30px;
      padding:8px 13px;
      font-size:12px;
      font-weight:700;
    }

    .status-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--green);
    }

    /* TIMELINE */
    .timeline{
      padding:23px 24px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      position:relative;
    }

    .timeline::before{
      content:"";
      position:absolute;
      left:11%;
      right:11%;
      top:35px;
      height:2px;
      background:#ddd;
      z-index:0;
    }

    .step{
      width:20%;
      text-align:center;
      position:relative;
      z-index:1;
    }

    .step-circle{
      width:25px;
      height:25px;
      border-radius:50%;
      background:#ddd;
      border:4px solid white;
      margin:0 auto 9px;
    }

    .step.active .step-circle{
      background:var(--black);
    }

    .step p{
      font-size:10px;
      color:#999;
      font-weight:600;
    }

    .step.active p{
      color:var(--black);
    }

    /* PRODUCTS */
    .order-products{
      padding:8px 24px 22px;
    }

    .product-row{
      display:flex;
      align-items:center;
      gap:16px;
      padding:15px 0;
      border-bottom:1px solid #eee;
    }

    .product-row:last-child{
      border-bottom:0;
    }

    .product-img{
      width:78px;
      height:94px;
      border-radius:12px;
      object-fit:cover;
      background:#eee;
    }

    .product-info{
      flex:1;
    }

    .product-info h3{
      font-size:15px;
      margin-bottom:7px;
    }

    .product-meta{
      color:var(--muted);
      font-size:12px;
      line-height:1.8;
    }

    .product-price{
      font-weight:800;
      font-size:15px;
      white-space:nowrap;
    }

    /* ORDER BOTTOM */
    .order-bottom{
      border-top:1px solid var(--border);
      padding:20px 24px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:25px;
    }

    .info-title{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1.5px;
      color:var(--muted);
      font-weight:700;
      margin-bottom:9px;
    }

    .info-text{
      font-size:13px;
      line-height:1.7;
    }

    .payment-box{
      text-align:right;
    }

    .amount-row{
      display:flex;
      justify-content:flex-end;
      gap:30px;
      font-size:13px;
      margin:5px 0;
    }

    .amount-row.total{
      font-size:17px;
      font-weight:800;
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid var(--border);
    }

    .advance{
      color:var(--green);
      font-weight:700;
    }

    /* BUTTONS */
    .order-actions{
      padding:0 24px 24px;
      display:flex;
      gap:10px;
      justify-content:flex-end;
    }

    .btn{
      border-radius:28px;
      padding:11px 18px;
      cursor:pointer;
      font-size:13px;
      font-weight:700;
      border:1px solid var(--black);
    }

    .btn-primary{
      background:var(--black);
      color:white;
    }

    .btn-primary:hover{
      background:#333;
    }

    .btn-light{
      background:white;
      color:var(--black);
      border-color:var(--border);
    }

    .btn-light:hover{
      background:#f5eee8;
    }

    /* EMPTY */
    .empty{
      background:white;
      border:1px solid var(--border);
      border-radius:25px;
      padding:70px 25px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .empty-icon{
      width:70px;
      height:70px;
      border-radius:50%;
      background:#f2e7df;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      margin:0 auto 20px;
    }

    .empty h2{
      font-family:Georgia,serif;
      font-size:27px;
      margin-bottom:10px;
    }

    .empty p{
      color:var(--muted);
      font-size:14px;
      margin-bottom:25px;
    }

    /* FOOTER */
    .footer{
      background:var(--black);
      color:white;
      text-align:center;
      padding:30px 20px;
      font-size:12px;
      color:#aaa;
    }

    /* TOAST */
    .toast{
      position:fixed;
      right:22px;
      bottom:22px;
      background:var(--black);
      color:white;
      padding:14px 18px;
      border-radius:12px;
      font-size:13px;
      opacity:0;
      transform:translateY(20px);
      pointer-events:none;
      transition:.3s;
      z-index:9999;
    }

    .toast.show{
      opacity:1;
      transform:translateY(0);
    }

    /* MOBILE */
    @media(max-width:800px){

      .header{
        height:auto;
        min-height:70px;
        padding:15px 4%;
        flex-wrap:wrap;
        gap:13px;
      }

      .nav{
        order:3;
        width:100%;
        overflow-x:auto;
        gap:20px;
        padding-bottom:3px;
      }

      .header-actions{
        margin-left:auto;
      }

      .page{
        width:94%;
        padding-top:35px;
      }

      .page-head h1{
        font-size:32px;
      }

      .account-card{
        align-items:flex-start;
        flex-direction:column;
      }

      .timeline{
        overflow-x:auto;
        min-width:560px;
      }

      .timeline-wrap{
        overflow-x:auto;
      }

      .order-bottom{
        grid-template-columns:1fr;
      }

      .payment-box{
        text-align:left;
      }

      .amount-row{
        justify-content:space-between;
      }

      .order-actions{
        justify-content:stretch;
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }

    @media(max-width:500px){

      .logo{
        font-size:24px;
      }

      .header-btn{
        padding:8px 11px;
        font-size:12px;
      }

      .product-img{
        width:65px;
        height:80px;
      }

      .product-row{
        gap:11px;
      }

      .product-price{
        font-size:13px;
      }

      .order-top,
      .order-products,
      .order-bottom,
      .order-actions{
        padding-left:17px;
        padding-right:17px;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">ZIVA</a>

  <nav class="nav">
    <a href="index.html#new-in">New In</a>
    <a href="index.html#women-section">Women</a>
    <a href="index.html#mens-section">Men</a>
    <a href="index.html#trending-section">Trending</a>
    <a href="index.html#sale-section">Sale</a>
  </nav>

  <div class="header-actions">
    <button class="header-btn" onclick="window.location.href='cart.html'">
      🛍 Cart
    </button>

    <button class="header-btn" onclick="window.location.href='index.html'">
      Shop
    </button>
  </div>

</header>


<main class="page">

  <section class="page-head">

    <div class="eyebrow">ZIVA Account</div>

    <h1>My Orders</h1>

    <p>
      Track and manage your ZIVA orders in one place.
    </p>

  </section>


  <!-- ACCOUNT -->
  <section class="account-card">

    <div class="account-info">

      <div class="avatar" id="userAvatar">
        Z
      </div>

      <div>
        <h3 id="userName">
          ZIVA Customer
        </h3>

        <p id="userIdentifier">
          Your account
        </p>
      </div>

    </div>

    <button class="logout-btn" onclick="logoutZiva()">
      Logout
    </button>

  </section>


  <!-- ORDERS -->
  <section id="ordersContainer"></section>

</main>


<footer class="footer">
  © 2026 ZIVA. All rights reserved.
</footer>


<div class="toast" id="toast"></div>


<script>

  /* =========================
     LOGIN CHECK
  ========================= */

  function isLoggedIn(){

    return localStorage.getItem("zivaLoggedIn") === "true";

  }


  /* =========================
     CURRENT USER
  ========================= */

  function getCurrentUser(){

    try{

      return JSON.parse(
        localStorage.getItem("zivaCurrentUser") || "{}"
      );

    }catch(error){

      return {};

    }

  }


  /* =========================
     FORMAT PRICE
  ========================= */

  function formatPrice(value){

    return "₹" + Number(value || 0).toLocaleString("en-IN");

  }


  /* =========================
     FORMAT DATE
  ========================= */

  function formatDate(dateValue){

    if(!dateValue){

      return "Date unavailable";

    }

    const date = new Date(dateValue);

    if(isNaN(date.getTime())){

      return "Date unavailable";

    }

    return date.toLocaleDateString("en-IN",{

      day:"2-digit",
      month:"short",
      year:"numeric"

    });

  }


  /* =========================
     FORMAT TIME
  ========================= */

  function formatTime(dateValue){

    if(!dateValue){

      return "";

    }

    const date = new Date(dateValue);

    if(isNaN(date.getTime())){

      return "";

    }

    return date.toLocaleTimeString("en-IN",{

      hour:"2-digit",
      minute:"2-digit"

    });

  }


  /* =========================
     IMAGE
  ========================= */

  function getProductImage(product){

    if(!product){

      return "";

    }

    if(product.image){

      return product.image;

    }

    if(Array.isArray(product.images) && product.images.length){

      return product.images[0];

    }

    return "";

  }


  /* =========================
     GET ORDERS
  ========================= */

  function getOrders(){

    try{

      const orders = JSON.parse(
        localStorage.getItem("zivaOrders") || "[]"
      );

      return Array.isArray(orders) ? orders : [];

    }catch(error){

      return [];

    }

  }


  /* =========================
     ORDER STATUS
  ========================= */

  function getOrderStatus(order){

    /*
      Current testing system starts
      every order as "Placed".
      Later backend will update this.
    */

    return order.status || "Placed";

  }


  /* =========================
     INITIALS
  ========================= */

  function getInitial(name){

    if(!name){

      return "Z";

    }

    return name.trim().charAt(0).toUpperCase();

  }


  /* =========================
     USER
  ========================= */

  function renderUser(){

    const user = getCurrentUser();

    const name =
      user.name ||
      "ZIVA Customer";

    const identifier =
      user.identifier ||
      "";

    document.getElementById("userName").textContent = name;

    document.getElementById("userIdentifier").textContent =
      identifier;

    document.getElementById("userAvatar").textContent =
      getInitial(name);

  }


  /* =========================
     ORDER ITEMS
  ========================= */

  function getOrderItems(order){

    if(Array.isArray(order.items)){

      return order.items;

    }

    if(order.product){

      return [order.product];

    }

    return [];

  }


  /* =========================
     RENDER PRODUCT
  ========================= */

  function renderProduct(product){

    const image =
      getProductImage(product);

    const name =
      product.name ||
      "ZIVA Product";

    const price =
      Number(product.price || 0);

    const quantity =
      Number(product.quantity || 1);

    const sizeText = [

      product.tshirtSize
        ? "T-Shirt: " + product.tshirtSize
        : "",

      product.pantSize
        ? "Waist: " + product.pantSize
        : "",

      product.size
        ? "Size: " + product.size
        : ""

    ].filter(Boolean).join(" • ");

    return `

      <div class="product-row">

        ${
          image
          ?
          `<img
            class="product-img"
            src="${image}"
            alt="${name}"
          >`
          :
          `<div class="product-img"></div>`
        }

        <div class="product-info">

          <h3>
            ${name}
          </h3>

          <div class="product-meta">

            ${
              sizeText
              ?
              sizeText + "<br>"
              :
              ""
            }

            Quantity: ${quantity}

          </div>

        </div>

        <div class="product-price">

          ${formatPrice(price * quantity)}

        </div>

      </div>

    `;

  }


  /* =========================
     RENDER TIMELINE
  ========================= */

  function renderTimeline(status){

    const statuses = [

      "Placed",
      "Confirmed",
      "Shipped",
      "Out for Delivery",
      "Delivered"

    ];

    const currentIndex =
      Math.max(
        0,
        statuses.indexOf(status)
      );

    return `

      <div class="timeline-wrap">

        <div class="timeline">

          ${statuses.map((item,index)=>`

            <div class="step ${
              index <= currentIndex
              ? "active"
              : ""
            }">

              <div class="step-circle"></div>

              <p>
                ${item}
              </p>

            </div>

          `).join("")}

        </div>

      </div>

    `;

  }


  /* =========================
     RENDER ORDER
  ========================= */

  function renderOrder(order,index){

    const items =
      getOrderItems(order);

    const status =
      getOrderStatus(order);

    const subtotal =
      Number(
        order.subtotal ??
        order.total ??
        0
      );

    const paymentMethod =
      order.paymentMethod ||
      order.payment ||
      "Online Payment";

    const isCOD =
      paymentMethod
        .toLowerCase()
        .includes("cod");

    const advance =
      isCOD
      ?
      Number(
        order.codAdvance ??
        order.advance ??
        250
      )
      :
      0;

    const remaining =
      isCOD
      ?
      Math.max(
        0,
        subtotal - advance
      )
      :
      0;

    const orderId =
      order.orderId ||
      order.id ||
      ("ZIVA-" + String(index+1).padStart(5,"0"));

    const orderDate =
      order.createdAt ||
      order.date ||
      new Date().toISOString();

    const address = [

      order.address,
      order.city,
      order.state,
      order.pincode ||
      order.pin

    ].filter(Boolean).join(", ");

    const customerName =
      order.name ||
      order.customerName ||
      "Customer";

    const phone =
      order.phone ||
      "";

    return `

      <article class="order-card">

        <!-- TOP -->

        <div class="order-top">

          <div>

            <div class="order-id">

              Order #${orderId}

            </div>

            <div class="order-date">

              ${formatDate(orderDate)}
              ${formatTime(orderDate)}

            </div>

          </div>

          <div class="status">

            <span class="status-dot"></span>

            ${status}

          </div>

        </div>


        <!-- TIMELINE -->

        ${renderTimeline(status)}


        <!-- PRODUCTS -->

        <div class="order-products">

          ${
            items.length
            ?
            items.map(renderProduct).join("")
            :
            `
              <div class="product-meta">
                Product details unavailable.
              </div>
            `
          }

        </div>


        <!-- DETAILS -->

        <div class="order-bottom">

          <div>

            <div class="info-title">
              Delivery Details
            </div>

            <div class="info-text">

              <strong>
                ${customerName}
              </strong>

              ${
                phone
                ?
                `<br>${phone}`
                :
                ""
              }

              ${
                address
                ?
                `<br>${address}`
                :
                ""
              }

            </div>

          </div>


          <div class="payment-box">

            <div class="info-title">
              Payment
            </div>

            <div class="info-text">

              ${
                isCOD
                ?
                "Cash on Delivery"
                :
                "Online Payment"
              }

            </div>

            <div class="amount-row">

              <span>
                Order Value
              </span>

              <strong>
                ${formatPrice(subtotal)}
              </strong>

            </div>

            ${
              isCOD
              ?
              `

                <div class="amount-row">

                  <span>
                    Advance Paid
                  </span>

                  <strong class="advance">
                    ${formatPrice(advance)}
                  </strong>

                </div>

                <div class="amount-row">

                  <span>
                    Pay at Delivery
                  </span>

                  <strong>
                    ${formatPrice(remaining)}
                  </strong>

                </div>

              `
              :
              ""
            }

            <div class="amount-row total">

              <span>
                Total
              </span>

              <strong>
                ${formatPrice(subtotal)}
              </strong>

            </div>

          </div>

        </div>


        <!-- ACTIONS -->

        <div class="order-actions">

          <button
            class="btn btn-light"
            onclick="viewOrder('${orderId}')"
          >
            View Details
          </button>

          <button
            class="btn btn-primary"
            onclick="continueShopping()"
          >
            Continue Shopping
          </button>

        </div>

      </article>

    `;

  }


  /* =========================
     RENDER ALL ORDERS
  ========================= */

  function renderOrders(){

    const container =
      document.getElementById("ordersContainer");

    const orders =
      getOrders();

    if(!orders.length){

      container.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🛍
          </div>

          <h2>
            No orders yet
          </h2>

          <p>
            You haven't placed an order with ZIVA yet.
            Discover our latest collection and start shopping.
          </p>

          <button
            class="btn btn-primary"
            onclick="continueShopping()"
          >
            Start Shopping
          </button>

        </div>

      `;

      return;

    }

    /*
      Newest order first
    */

    orders.sort((a,b)=>{

      const dateA =
        new Date(
          a.createdAt ||
          a.date ||
          0
        ).getTime();

      const dateB =
        new Date(
          b.createdAt ||
          b.date ||
          0
        ).getTime();

      return dateB - dateA;

    });

    container.innerHTML =
      `<div class="orders-list">
        ${
          orders.map(
            (order,index)=>
              renderOrder(order,index)
          ).join("")
        }
      </div>`;

  }


  /* =========================
     VIEW ORDER
  ========================= */

  function viewOrder(orderId){

    const orders =
      getOrders();

    const order =
      orders.find(item =>

        String(
          item.orderId ||
          item.id
        ) === String(orderId)

      );

    if(!order){

      showToast(
        "Order details not available."
      );

      return;

    }

    /*
      Store selected order so a
      future order-details page
      can use it.
    */

    localStorage.setItem(
      "zivaSelectedOrder",
      JSON.stringify(order)
    );

    /*
      For now show a professional
      simple notification.
    */

    showToast(
      "Order details selected."
    );

  }


  /* =========================
     SHOPPING
  ========================= */

  function continueShopping(){

    window.location.href =
      "index.html";

  }


  /* =========================
     LOGOUT
  ========================= */

  function logoutZiva(){

    localStorage.removeItem(
      "zivaLoggedIn"
    );

    localStorage.removeItem(
      "zivaCurrentUser"
    );

    window.location.href =
      "login.html";

  }


  /* =========================
     TOAST
  ========================= */

  function showToast(message){

    const toast =
      document.getElementById("toast");

    toast.textContent =
      message;

    toast.classList.add("show");

    setTimeout(()=>{

      toast.classList.remove("show");

    },2500);

  }


  /* =========================
     START
  ========================= */

  document.addEventListener(
    "DOMContentLoaded",
    function(){

      if(!isLoggedIn()){

        window.location.href =
          "login.html";

        return;

      }

      renderUser();

      renderOrders();

    }
  );

</script>
